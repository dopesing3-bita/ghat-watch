  a_terms: "Dissolved oxygen (DO) is the oxygen in the water that fish and other aquatic life need; CPCB class B asks for at least {do_min} mg/l. BOD (biochemical oxygen demand) is how much oxygen organic waste uses up as it breaks down; class B allows at most {bod_max} mg/l. Low DO and high BOD both point to heavy organic load in the water."
  a_verify: "Before acting: confirm which ghats BMC has designated for this visarjan; check the key readings on the linked report pages; treat close ranks (overlapping rank ranges) as a group; remember units are assumed and total coliform was not tested; and get fresh test results, because these readings are from 2023 to 2025."
  a_brief: "The one-page brief on the Brief screen is built from the same scoring engine: top 3 ghats with their readings and report pages, data gaps and an honesty box. Open it to print, copy or share it after review."
  a_live: "Ghat Watch holds only MPPCB readings from 2023 to 2025. It has no current or live measurements, so it cannot say what the water is like now. A fresh sample from the testing lab is needed for that."
  a_health: "This tool compares readings with CPCB class B limits only. It cannot say whether the water is fit for bathing or any human use, or whether it affects health."
  lim_hist: "Readings are from 2023 to 2025 only."
  lim_units: "Units are assumed; the reports print none."
  lim_coliform: "Total coliform is not in the data."
  lim_relative: "The ranking is relative: no ghat met the limits throughout."
  lim_few: "Each ghat has only a few sampling events."
  step_open: "Open the ghat's evidence page and check the linked report pages."
  step_plan: "Review the action plan and assign the work."
  step_test: "Arrange fresh tests before, during and one week after immersion."
datapage:
  title: "Data and method"
  lede: "What the data is, how the score is worked out, how the AI assistant is kept to the evidence, and what none of it can tell you."
  issues: "Data points to verify"
  issue_rl: "{param} {year} {festival}: the same value {value} at every ghat and phase ({count} readings). It looks like a lab reporting limit, so it is left out of the spike check."
  issue_identity: "{name}: the Ganesh and Durga tables use different site names, so it may be two places."
  issue_notable: "{names}: no {festival} {year} table in the report."
  sections:
    - id: provenance
      h: "Where the data comes from"
      p:
        - "Every reading comes from {file}: {rows} rows, supplied in the event pack and spot-checked by the organisers against the MPPCB idol-immersion reports for {years}. Each row carries the report page it came from, and every Report p. link opens that page of the official PDF."
        - "The app never fetches data from a government portal. It uses only the CSV and the documented settings in rules.yaml and ghats.yaml."
    - id: period
      h: "Period and sampling phases"
      p:
        - "Years: {years}. Festivals: Ganesh and Durga. Phases: before immersion, during immersion and one week after. {ghats_with_data} ghats have readings; {nohist} designated ghat has none."
        - "This is historical data. Nothing here is a live or current measurement."
    - id: status
      h: "Measured, BDL and missing"
      p:
        - "Of {rows} readings, {valid} are measured numbers, {bdl} are BDL (below the detection limit: very low, but not zero and not missing) and {missing} are missing (a blank, _, * or ** in the report)."
        - "Missing readings are never counted as clean and never as zero. They are left out of pass and fail counts and drawn hatched. BDL is always shown as BDL."
    - id: units
      h: "Units"
      p:
        - "The reports print no units. The app shows the standard unit for each test, marked 'unit assumed': {units}."
    - id: method
      h: "How the score works"
      p:
        - "Readings are compared with CPCB class B (organised outdoor bathing): DO at least {do_min} mg/l, BOD at most {bod_max} mg/l, pH {ph_min} to {ph_max}. Metals and other parameters have no class B limit and give no points."
        - "The score out of 100 adds five parts: oxygen stress (up to {oxygen}), organic load ({organic}), pH ({ph}), immersion impact ({impact}) and recovery ({recovery}). Tiers: Priority 1 at {p1} or more, Priority 2 from {p2}, Priority 3 below. This is a rule-based score, not a prediction model. Every weight is a proposal in rules.yaml for BMC or MPPCB to review."
    - id: sensitivity
      h: "Ranking sensitivity"
      p:
        - "Ranks are recomputed under {runs} random weight sets, each weight between half and one and a half times its value. A ghat's rank range shows how far its rank moves. Overlapping ranges mean the order between those ghats depends on the weights."
    - id: ai
      h: "How the AI assistant gets its evidence"
      p:
        - "The AI never sees the whole dataset and never sets a score. For each question the app picks the matching ghats, parameters and readings, and the scores already calculated by the scoring engine. Only that evidence goes to Gemini, which is told to explain it without adding numbers."
        - "Before you see a reply, the server checks it: references that do not match the data are removed, statements with numbers not found in the evidence are marked, web links are dropped and health or safety wording is removed. Report links always come from the data, never from the AI. Common questions are answered without AI at all."
    - id: cannot
      h: "What the app cannot conclude"
      p:
        - "It cannot say what the water is like today, forecast 2026 water quality, say whether water is fit for bathing or any human use, establish the cause of any change, or confirm that any action was carried out. It is not approved by BMC, MPPCB or CPCB."
    - id: update
      h: "Updating after a new festival"
      p:
        - "Append the new rows to the CSV in the same columns, add the year in rules.yaml and the report file in src/sources.py, run .venv/bin/python -m src.build and the tests, then publish the docs folder. The AI assistant reads the same rebuilt data."
    - id: offline
      h: "What works offline"
      p:
        - "Everything except AI explanations works offline and from disk: overview, analytics, evidence, comparisons, the no-AI answers, the action plan, the brief and this page. AI explanations need internet and the Vercel deployment with a configured key; they are never cached."
    - id: before
      h: "Before government use"
      p:
        - "A Hindi reader approves the Hindi text; a second person checks the numbers in docs/VERIFICATION.md against the PDFs; BMC confirms the ghat list; BMC or MPPCB review the weights and tiers; and the tool is piloted with a real officer, hosted on a government server, with a named owner."
