  sep: "; "
help:                       # BR-63 उपयोग मार्गदर्शिका। Every line needs approval.  REVIEW: Hindi reviewer
  title: घाट वॉच का उपयोग कैसे करें   # REVIEW: Hindi reviewer
  lede: "घाट वॉच भोपाल के विसर्जन घाटों पर MPPCB की तीन वर्ष की जल जांच को एक क्रम सूची में रखता है, ताकि आप {event} को दुर्गा विसर्जन से पहले तय कर सकें कि अतिरिक्त सफाई, एरेशन और जांच कहां भेजनी है।"   # REVIEW: Hindi reviewer
  sections:
    - id: steps
      h: चार चरण   # REVIEW: Hindi reviewer
      items:
        - t: 1. क्रम सूची पढ़ें   # REVIEW: Hindi reviewer
          d: "सबसे अधिक दर्ज जोखिम वाला घाट सबसे ऊपर है। हर पंक्ति में सरल शब्दों में कारण, डेटा कितना है, और क्रम कितना स्थिर है, यह दिया है।"   # REVIEW: Hindi reviewer
        - t: 2. प्रमाण देखें   # REVIEW: Hindi reviewer
          d: "किसी घाट पर टैप करें और उसके अंकों के पीछे की हर रीडिंग देखें। हर रीडिंग के साथ 'रिपोर्ट पृ.' लिंक है जो आधिकारिक MPPCB रिपोर्ट का वही पृष्ठ खोलता है।"   # REVIEW: Hindi reviewer
        - t: 3. काम की योजना बनाएं   # REVIEW: Hindi reviewer
          d: "कार्य योजना सुझाए गए कामों को तारीख के अनुसार रखती है: विसर्जन से पहले, विसर्जन के दिन, और एक सप्ताह बाद। टीम का काम पूरा होने पर निशान लगाएं। निशान इसी उपकरण पर रहते हैं।"   # REVIEW: Hindi reviewer
        - t: 4. संक्षिप्त नोट भेजें   # REVIEW: Hindi reviewer
          d: "संक्षिप्त नोट हिन्दी या अंग्रेज़ी में एक A4 पृष्ठ है। इसे कॉपी करें, WhatsApp पर भेजें, या प्रिंट करें या PDF सहेजें।"   # REVIEW: Hindi reviewer
    - id: controls
      h: नियंत्रण   # REVIEW: Hindi reviewer
      items:
        - t: सभी त्योहार या केवल दुर्गा   # REVIEW: Hindi reviewer
          d: "'सभी त्योहार' 2023 से 2025 तक की गणेश और दुर्गा की हर जांच लेता है, जिससे प्रमाण अधिक है। 'केवल दुर्गा' सिर्फ दुर्गा की जांच लेता है। अगर दोनों दृश्यों में किसी घाट का क्रम 2 या अधिक स्थान बदलता है तो बैज दिखता है।"   # REVIEW: Hindi reviewer
        - t: हिन्दी / English
          d: "हर पृष्ठ और संक्षिप्त नोट की भाषा बदलता है। लिंक के अंत में ?lang=hi जोड़ने से उपकरण सीधे हिन्दी में खुलता है।"   # REVIEW: Hindi reviewer
        - t: A− A A+
          d: "अक्षर छोटे या बड़े करता है। आपकी पसंद इसी उपकरण पर याद रहती है।"   # REVIEW: Hindi reviewer
    - id: score
      h: अंक कैसे बनते हैं   # REVIEW: Hindi reviewer
      p: "रीडिंग की तुलना संगठित बाहरी स्नान के लिए CPCB क्लास B सीमा से की जाती है: घुलित ऑक्सीजन कम से कम {do_min} mg/l, BOD अधिकतम {bod_max} mg/l, pH 6.5 से 8.5। 100 में से अंक पांच भागों को जोड़कर बनते हैं।"   # REVIEW: Hindi reviewer
      items:
        - t: "ऑक्सीजन की कमी, अधिकतम {oxygen} अंक"   # REVIEW: Hindi reviewer
          d: "{do_min} mg/l से कम DO वाली रीडिंग का हिस्सा, और DO 2 से नीचे जाने या 0 दर्ज होने पर अतिरिक्त अंक।"   # REVIEW: Hindi reviewer
        - t: "जैविक प्रदूषण भार, अधिकतम {organic} अंक"   # REVIEW: Hindi reviewer
          d: "{bod_max} mg/l से अधिक BOD वाली रीडिंग का हिस्सा, और विसर्जन के दौरान BOD सीमा के तीन गुना तक पहुंचने पर अतिरिक्त अंक।"   # REVIEW: Hindi reviewer
        - t: "पीएच, अधिकतम {ph} अंक"   # REVIEW: Hindi reviewer
          d: "6.5 से 8.5 के बाहर pH वाली रीडिंग का हिस्सा।"   # REVIEW: Hindi reviewer
        - t: "विसर्जन का असर, अधिकतम {impact} अंक"   # REVIEW: Hindi reviewer
          d: "कितनी बार विसर्जन के दौरान पानी पहले से खराब था। केवल वे जोड़ियां गिनी जाती हैं जिनमें दोनों रीडिंग हैं।"   # REVIEW: Hindi reviewer
        - t: "सुधार, अधिकतम {recovery} अंक"   # REVIEW: Hindi reviewer
          d: "कितनी बार एक सप्ताह बाद भी पानी विसर्जन से पहले की तुलना में खराब था।"   # REVIEW: Hindi reviewer
        - t: प्राथमिकता स्तर   # REVIEW: Hindi reviewer
          d: "{p1} या अधिक पर प्राथमिकता 1, {p2} से प्राथमिकता 2, {p2} से कम पर प्राथमिकता 3। कोई हरा स्तर नहीं है: BOD {bod_valid} में से {bod_above} रीडिंग में सीमा से अधिक था, इसलिए यह क्रम तुलनात्मक है।"   # REVIEW: Hindi reviewer
        - t: क्रम का दायरा   # REVIEW: Hindi reviewer
          d: "क्रम {runs} यादृच्छिक भार-सेट में दोबारा निकाला जाता है। छोटा दायरा मतलब भार कुछ भी हों, क्रम वही रहता है। बड़ा दायरा मतलब आसपास के घाट करीब हैं।"   # REVIEW: Hindi reviewer
    - id: badges
      h: बैज का अर्थ   # REVIEW: Hindi reviewer
      items:
        - t: सीमित डेटा   # REVIEW: Hindi reviewer
          d: "अपेक्षित DO और BOD रीडिंग में से {limited} से कम उपलब्ध हैं। क्रम रखा गया है, पर वह कम प्रमाण पर टिका है।"   # REVIEW: Hindi reviewer
        - t: पहचान अनिश्चित   # REVIEW: Hindi reviewer
          d: "गणेश की तालिकाओं में कमला पार्क कुंड और दुर्गा की तालिकाओं में लोअर लेक घाट लिखा है। ये दो अलग जगह हो सकती हैं।"   # REVIEW: Hindi reviewer
        - t: धातुओं में उछाल   # REVIEW: Hindi reviewer
          d: "विसर्जन के दौरान किसी धातु की रीडिंग पहले की रीडिंग से कम से कम 5 गुना थी, या BDL से संख्या में बदली। धातुओं की क्लास B सीमा नहीं है और उनसे अंक नहीं मिलते। डेटा से कारण स्थापित नहीं होता।"   # REVIEW: Hindi reviewer
        - t: संभवतः रिपोर्टिंग-सीमा मान   # REVIEW: Hindi reviewer
          d: "एक त्योहार के हर घाट और हर चरण में धातु का एक ही मान है, जो प्रयोगशाला की रिपोर्टिंग सीमा जैसा लगता है। इसे उछाल की जांच से बाहर रखा गया है।"   # REVIEW: Hindi reviewer
        - t: केवल-दुर्गा दृश्य में क्रम अलग   # REVIEW: Hindi reviewer
          d: "केवल दुर्गा की जांच लेने पर घाट 2 या अधिक स्थान ऊपर-नीचे होता है।"   # REVIEW: Hindi reviewer
        - t: कोई पुराना डेटा नहीं   # REVIEW: Hindi reviewer
          d: "2023 से 2025 की रिपोर्टों में इस घाट की कोई रीडिंग नहीं है। कार्य योजना में {event} से पहले आधार जांच दी गई है।"   # REVIEW: Hindi reviewer
    - id: glossary
      h: शब्दावली   # REVIEW: Hindi reviewer
      items:
        - t: घुलित ऑक्सीजन (DO)   # REVIEW: Hindi reviewer
          d: "पानी में घुली ऑक्सीजन। मछलियों और अन्य जलीय जीवों को इसकी जरूरत होती है। क्लास B में कम से कम {do_min} mg/l चाहिए।"   # REVIEW: Hindi reviewer
        - t: बीओडी (BOD)   # REVIEW: Hindi reviewer
          d: "जैव-रासायनिक ऑक्सीजन मांग: जैविक कचरा सड़ते समय कितनी ऑक्सीजन खर्च करता है। क्लास B में अधिकतम {bod_max} mg/l की अनुमति है।"   # REVIEW: Hindi reviewer
        - t: पीएच (pH)   # REVIEW: Hindi reviewer
          d: "पानी कितना अम्लीय या क्षारीय है। 7 उदासीन है। क्लास B की सीमा 6.5 से 8.5 है।"   # REVIEW: Hindi reviewer
        - t: BDL
          d: "पहचान सीमा से नीचे: बहुत कम, पर शून्य नहीं और अनुपलब्ध भी नहीं। इसे BDL ही दिखाया जाता है, कभी 0 नहीं।"   # REVIEW: Hindi reviewer
        - t: नमूना नहीं लिया गया   # REVIEW: Hindi reviewer
          d: "रिपोर्ट में उस जांच के लिए खाली, _, * या ** है। इसे अनुपलब्ध माना जाता है, कभी साफ नहीं, और धारीदार दिखाया जाता है।"   # REVIEW: Hindi reviewer
        - t: रिपोर्ट में तालिका नहीं   # REVIEW: Hindi reviewer
          d: "रिपोर्ट में उस घाट और त्योहार की कोई तालिका ही नहीं है, जैसे दुर्गा 2025 में बैरागढ़ और मालीखेड़ी।"   # REVIEW: Hindi reviewer
        - t: CPCB क्लास B   # REVIEW: Hindi reviewer
          d: "केंद्रीय प्रदूषण नियंत्रण बोर्ड का संगठित बाहरी स्नान के लिए जल-गुणवत्ता वर्ग। घाट पर लोगों के पानी में उतरने के सबसे निकट यही सूचीबद्ध उपयोग है।"   # REVIEW: Hindi reviewer
        - t: डेटा उपलब्धता   # REVIEW: Hindi reviewer
          d: "तीन वर्ष, दो त्योहार और तीन चरणों में अपेक्षित DO और BOD रीडिंग में से कितनी मान्य रीडिंग उपलब्ध हैं।"   # REVIEW: Hindi reviewer
        - t: इकाइयां   # REVIEW: Hindi reviewer
          d: "रिपोर्टों में इकाइयां छपी नहीं हैं। हर जांच की मानक इकाई मानी गई है और 'इकाई मानी गई' लिखा गया है।"   # REVIEW: Hindi reviewer
    - id: faq
      h: अधिकारियों के प्रश्न   # REVIEW: Hindi reviewer
      items:
        - t: कोई घाट हरे रंग में क्यों नहीं दिखाया गया?   # REVIEW: Hindi reviewer
          d: "सभी घाटों में BOD {bod_valid} में से {bod_above} रीडिंग में क्लास B सीमा से अधिक था। कोई घाट पूरे समय सीमा के भीतर नहीं रहा, इसलिए उपकरण प्राथमिकता दिखाता है, पास-फेल नहीं।"   # REVIEW: Hindi reviewer
        - t: क्या क्रम 2 से 6 पर भरोसा किया जा सकता है?   # REVIEW: Hindi reviewer
          d: "पास-पास के क्रम को एक समूह मानें। हर पंक्ति में क्रम का दायरा देखें: जहां दायरे मिलते हैं, वहां उन घाटों का आपसी क्रम भार पर निर्भर है।"   # REVIEW: Hindi reviewer
        - t: क्या यह कहता है कि पानी लोगों को नुकसान करता है?   # REVIEW: Hindi reviewer
          d: "नहीं। यह केवल रीडिंग की CPCB क्लास B सीमा से तुलना करता है। टोटल कोलीफॉर्म, क्लास B की बैक्टीरिया जांच, इन रिपोर्टों में नहीं है।"   # REVIEW: Hindi reviewer
        - t: क्या कुछ इंटरनेट पर भेजा जाता है?   # REVIEW: Hindi reviewer
