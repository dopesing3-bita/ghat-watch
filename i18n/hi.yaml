  gap_no_table: "{names}: रिपोर्ट में {festival} {year} की तालिका नहीं।"   # REVIEW: Hindi reviewer
  gap_cells: "{count} अन्य DO या BOD रीडिंग 'नमूना नहीं लिया गया' दर्ज हैं।"   # REVIEW: Hindi reviewer
  gap_coliform: "टोटल कोलीफॉर्म इन रिपोर्टों में शामिल नहीं है।"   # REVIEW: Hindi reviewer
  honesty: यह नोट क्या नहीं कहता   # REVIEW: Hindi reviewer
  honesty_units: "इकाइयां मानी गई हैं। रिपोर्टों में इकाइयां छपी नहीं हैं।"   # REVIEW: Hindi reviewer
  honesty_relative: "यह क्रम तुलनात्मक है। BOD {bod_valid} में से {bod_above} रीडिंग में सीमा से अधिक था, इसलिए किसी घाट को सीमा के भीतर नहीं दिखाया गया।"   # REVIEW: Hindi reviewer
