        - "100 में से अंक पांच भागों को जोड़कर बनते हैं: ऑक्सीजन की कमी (अधिकतम {oxygen}), जैविक भार ({organic}), pH ({ph}), विसर्जन का असर ({impact}) और सुधार ({recovery})। स्तर: {p1} या अधिक पर प्राथमिकता 1, {p2} से प्राथमिकता 2, उससे कम प्राथमिकता 3। यह नियम-आधारित अंक है, पूर्वानुमान मॉडल नहीं। हर भार rules.yaml में BMC या MPPCB की समीक्षा के लिए प्रस्ताव है।"   # REVIEW: Hindi reviewer
    - id: sensitivity
