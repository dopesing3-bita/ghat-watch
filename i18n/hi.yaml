  issues: "जांचने योग्य डेटा बिंदु"   # REVIEW: Hindi reviewer
  issue_rl: "{param} {year} {festival}: हर घाट और चरण में एक ही मान {value} ({count} रीडिंग)। यह प्रयोगशाला की रिपोर्टिंग सीमा जैसा लगता है, इसलिए उछाल की जांच से बाहर है।"   # REVIEW: Hindi reviewer
  issue_identity: "{name}: गणेश और दुर्गा की तालिकाओं में स्थल के नाम अलग हैं, इसलिए ये दो जगह हो सकती हैं।"   # REVIEW: Hindi reviewer
  issue_notable: "{names}: रिपोर्ट में {festival} {year} की तालिका नहीं।"   # REVIEW: Hindi reviewer
  sections:
    - id: provenance
      h: "डेटा कहां से आता है"   # REVIEW: Hindi reviewer
      p:
        - "हर रीडिंग {file} से आती है: {rows} पंक्तियां, जो आयोजकों ने दीं और {years} की MPPCB मूर्ति-विसर्जन रिपोर्टों से जांचीं। हर पंक्ति में उसका रिपोर्ट पृष्ठ दर्ज है, और हर 'रिपोर्ट पृ.' लिंक आधिकारिक PDF का वही पृष्ठ खोलता है।"   # REVIEW: Hindi reviewer
        - "ऐप किसी सरकारी पोर्टल से डेटा नहीं लेता। यह केवल CSV और rules.yaml व ghats.yaml की दर्ज सेटिंग का उपयोग करता है।"   # REVIEW: Hindi reviewer
    - id: period
      h: "अवधि और नमूने के चरण"   # REVIEW: Hindi reviewer
      p:
        - "वर्ष: {years}। त्योहार: गणेश और दुर्गा। चरण: विसर्जन से पहले, दौरान और एक सप्ताह बाद। {ghats_with_data} घाटों की रीडिंग हैं; {nohist} निर्धारित घाट की कोई रीडिंग नहीं है।"   # REVIEW: Hindi reviewer
        - "यह ऐतिहासिक डेटा है। इसमें कुछ भी लाइव या वर्तमान माप नहीं है।"   # REVIEW: Hindi reviewer
    - id: status
      h: "मापी गई, BDL और अनुपलब्ध"   # REVIEW: Hindi reviewer
      p:
