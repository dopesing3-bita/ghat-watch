        - "अनुपलब्ध रीडिंग को कभी साफ या शून्य नहीं माना जाता। उन्हें पास-फेल गिनती से बाहर रखा जाता है और धारीदार दिखाया जाता है। BDL हमेशा BDL ही दिखता है।"   # REVIEW: Hindi reviewer
