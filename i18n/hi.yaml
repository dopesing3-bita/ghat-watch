        - "उत्तर दिखाने से पहले सर्वर उसे जांचता है: जो संदर्भ डेटा से मेल नहीं खाते वे हटाए जाते हैं, प्रमाण में न मिलने वाली संख्या वाले कथन चिह्नित होते हैं, वेब लिंक हटाए जाते हैं और स्वास्थ्य या सुरक्षा के शब्द हटाए जाते हैं। रिपोर्ट लिंक हमेशा डेटा से आते हैं, AI से कभी नहीं। आम प्रश्नों का उत्तर बिना AI के मिलता है।"   # REVIEW: Hindi reviewer
