brief:
  title: "घाट वॉच संक्षिप्त नोट: दुर्गा विसर्जन, 20 अक्टूबर 2026"   # REVIEW: Hindi reviewer
  prepared: "{date} को MPPCB की मूर्ति-विसर्जन रिपोर्ट 2023, 2024 और 2025 से तैयार। दृश्य: {scope}।"   # REVIEW: Hindi reviewer
  top: "दर्ज जोखिम के अनुसार शीर्ष 3 घाट"   # REVIEW: Hindi reviewer
  ghat_line: "{rank}. {name}: अंक {total} / 100, {tier}।"   # REVIEW: Hindi reviewer
  numbers: "रीडिंग: {reason}।"   # REVIEW: Hindi reviewer
  stability: "{stability}"
