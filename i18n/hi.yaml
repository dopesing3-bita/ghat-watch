help:                       # BR-63 उपयोग मार्गदर्शिका। Every line needs approval.  REVIEW: Hindi reviewer
  title: घाट वॉच का उपयोग कैसे करें   # REVIEW: Hindi reviewer
  lede: "घाट वॉच भोपाल के विसर्जन घाटों पर MPPCB की तीन वर्ष की जल जांच को एक क्रम सूची में रखता है, ताकि आप {event} को दुर्गा विसर्जन से पहले तय कर सकें कि अतिरिक्त सफाई, एरेशन और जांच कहां भेजनी है।"   # REVIEW: Hindi reviewer
  sections:
    - id: steps
      h: चार चरण   # REVIEW: Hindi reviewer
      items:
        - t: 1. क्रम सूची पढ़ें   # REVIEW: Hindi reviewer
          d: "सबसे अधिक दर्ज जोखिम वाला घाट सबसे ऊपर है। हर पंक्ति में सरल शब्दों में कारण, डेटा कितना है, और क्रम कितना स्थिर है, यह दिया है।"   # REVIEW: Hindi reviewer
        - t: 2. प्रमाण देखें   # REVIEW: Hindi reviewer
          d: "किसी घाट पर टैप करें और उसके अंकों के पीछे की हर रीडिंग देखें। हर रीडिंग के साथ 'रिपोर्ट पृ.' लिंक है जो आधिकारिक MPPCB रिपोर्ट का वही पृष्ठ खोलता है।"   # REVIEW: Hindi reviewer
        - t: 3. काम की योजना बनाएं   # REVIEW: Hindi reviewer
          d: "कार्य योजना सुझाए गए कामों को तारीख के अनुसार रखती है: विसर्जन से पहले, विसर्जन के दिन, और एक सप्ताह बाद। टीम का काम पूरा होने पर निशान लगाएं। निशान इसी उपकरण पर रहते हैं।"   # REVIEW: Hindi reviewer
        - t: 4. संक्षिप्त नोट भेजें   # REVIEW: Hindi reviewer
          d: "संक्षिप्त नोट हिन्दी या अंग्रेज़ी में एक A4 पृष्ठ है। इसे कॉपी करें, WhatsApp पर भेजें, या प्रिंट करें या PDF सहेजें।"   # REVIEW: Hindi reviewer
    - id: controls
      h: नियंत्रण   # REVIEW: Hindi reviewer
